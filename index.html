<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="IRUSU Monster: a spatial 3D monster you control with your hand, tracked with 21 landmarks, running in your phone browser.">
  <title>IRUSU Monster · Hand Control</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Camera feed (background layer) -->
  <video id="cam" playsinline muted autoplay></video>

  <!-- 3D monster (middle layer, transparent background) -->
  <div id="stage"></div>

  <!-- Hand skeleton overlay (top layer) -->
  <canvas id="overlay"></canvas>

  <header class="glass top">
    <div class="title">IRUSU Monster</div>
    <div class="pills">
      <span id="trackPill" class="pill">Hand: off</span>
      <span id="gesturePill" class="pill">Idle</span>
    </div>
  </header>

  <section id="intro" class="glass center">
    <h1>Spatial monster</h1>
    <p>Your hand is tracked with 21 landmarks and drives the monster in 3D.</p>
    <button id="startBtn" type="button">Start camera</button>
    <p id="introStatus" class="fine">Allow camera access when prompted. Needs HTTPS.</p>
  </section>

  <section id="help" class="glass bottom hidden">
    <ul>
      <li><b>Move</b> open palm</li>
      <li><b>Size</b> pinch thumb and index apart or together</li>
      <li><b>Roar</b> make a fist</li>
      <li><b>Look</b> point with your index finger</li>
    </ul>
    <div class="row">
      <button id="flipBtn" class="ghost" type="button">Flip camera</button>
      <button id="resetBtn" class="ghost" type="button">Reset</button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
